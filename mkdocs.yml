site_name: mocaco
site_description: Convergence analysis for Monte Carlo series
repo_url: https://github.com/emalvarol/mocaco

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - User Guide:
      - Polars Integration: user-guide/polars-integration.md
      - Custom Criteria: user-guide/custom-criteria.md
  - Tutorials:
      - Noise vs Smooth Convergence: tutorials/noise-vs-smooth.md
  - Methods:
      - clt_absolute: methods/clt_absolute.md
  - Constitution: constitution.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
