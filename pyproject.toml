[project]
name = "mocaco"
version = "0.1.0"
description = "Convergence analysis for Monte Carlo series — works with Polars DataFrames"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-only"}
authors = [
  {name = "Álvaro Esteban Muñoz", email = "em.alvaro.l@gmail.com"},
]
dependencies = [
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "scipy>=1.18.1",
    "rich>=15.0.0",
    "pandas>=3.0.6",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "ty>=0.0.84",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mocaco"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "TCH", "TID", "RUF", "N", "PT", "D"]
ignore = [
    "E501", # Line length
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D107", # Missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["mocaco"]

[tool.mypy]
python_version = "3.12"
# Enables a bundle of strict checks (disallow_untyped_defs, check_untyped_defs, etc.)
strict = true
# Forces you to explicitly handle cases where a variable might be None
strict_optional = true
# Warns if you return an 'Any' type from a function that expects a specific type
warn_return_any = true
# Warns if you leave a '# type: ignore' comment that is no longer needed
warn_unused_ignores = true
# Shows error codes in the output so you can easily silence specific ones if needed
show_error_codes = true

# Exceptions for third-party libraries without strict type hints
[[tool.mypy.overrides]]
module = [
    "scipy.*",
]
ignore_missing_imports = true
